<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width">
        <title>Uaena Albums</title>
        <link type="text/css" rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="home.css">
        

        <!-- Irina Serif font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inria+Serif&display=swap" rel="stylesheet">
        
    </head>
    <body>
        <!--Header-->
        <div class="header">
            <h3>IU (Li Ji-Eun)</h3>
            <nav>
                <a href="https://vernonnub.github.io/ID_ASG1/">Home</a>
                <a href="https://vernonnub.github.io/ID_ASG1/album.html">Albums</a>
                <a href="https://vernonnub.github.io/ID_ASG1/merch.html">Merch</a>
            </nav>
        </div>

        <!--Body-->
        <div class="main-content">
            <!--Image and Album Infos-->
            <div class="title-and-image">
                <div class="titles">
                    <h1 id="album-title"></h1>
                    <h2 id="album-subtitle"></h2>
                    <p id="album-description"></p>
                </div>   
                
                <!--Will be filled with javascript-->
                <img id="album-cover" src="" alt="album cover">
            </div>
            <div class="streaming-service">
                <div class="stream-header">
                    <h1 id="stream-title">Stream Now!</h1>
                </div>

                <!--Button Links-->
                <div class="stream-content">
                    <a id="album-youtube-link" href="" target="_blank"><img src="media/logos/logo_youtube.png" alt="Youtube Logo">Youtube</a>
                    <a id="album-spotify-link" href="" target="_blank"><img src="media/logos/logo_spotify.png" alt="Spotify Logo">Spotify</a>
                    <a id="album-apple-link" href="" target="_blank"><img src="media/logos/logo_apple.png" alt="Apple Logo">Apple</a>
                </div>

                <!-- Embedded content-->
                <!--Will be filled with javascript all the src-->
                <div class="embedded-content">
                    <iframe id="album-spotify-embbed" data-testid="embed-iframe" style="border-radius:12px" src="" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                    <iframe id="album-youtube-embbed" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    <iframe id="album-apple-embbed" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" frameborder="0" style="overflow:hidden;border-radius:10px;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src=""></iframe>
                </div>
            </div>
        </div>
        
                <!--Footer-->
        <div class="footer">
            <div class="terms-and-service">
                <a class="terms"><strong>Terms</strong></a>
                <a class="privacy"><strong>Privacy</strong></a>
                <a class="accessibility"><strong>Accessibility</strong></a>
                <a class="cookies"><strong>Cookies</strong></a>
            </div>
            <div class="social-platforms">
                <a class="facebook" href="https://www.facebook.com/iu.loen" target="_blank">
                    <img src="media/logos/logo_facebook.png" alt="facebook logo">
                </a>
                <a class="intagram" href="https://www.instagram.com/dlwlrma" target="_blank">
                    <img src="media/logos/logo_instagram.png" alt="instagram logo">
                </a>
                <a class="tiktok" href="https://www.tiktok.com/@_iuofficial" target="_blank">
                    <img src="media/logos/logo_tiktok.png" alt="tiktok logo">
                </a>
                <a class="twitter" href="https://x.com/_IUofficial" target="_blank">
                    <img src="media/logos/logo_twitter.png" alt="twitter logo">
                </a>
                <a class="youtube" href="https://www.youtube.com/@dlwlrma" target="_blank">
                    <img src="media/logos/logo_youtube.png" alt="youtube logo">
                </a>
            </div>
        </div>
        <script src="album/album_info.js" type="module"></script>
    </body>
</html>
